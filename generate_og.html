<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1200px;
      height: 630px;
      background-color: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      position: relative;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 80px;
    }
    /* Subtle technical blueprint grid */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    /* Outer brutalist border */
    .frame-border {
      position: absolute;
      inset: 24px;
      border: 1px solid #262626;
      pointer-events: none;
    }
    .top-meta {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: #A3A3A3;
      text-transform: uppercase;
    }
    .accent-box {
      width: 12px;
      height: 12px;
      background-color: #FF5A1F;
    }
    .main-content {
      position: relative;
      z-index: 10;
      margin-top: auto;
      margin-bottom: auto;
    }
    .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 96px;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      margin-bottom: 22px;
    }
    .tagline-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .orange-bar {
      width: 64px;
      height: 5px;
      background-color: #FF5A1F;
    }
    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #FF5A1F;
    }
    .bottom-meta {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #262626;
      padding-top: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #737373;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="frame-border"></div>

  <div class="top-meta">
    <div class="accent-box"></div>
    <span>SECTOR 04 // STRENGTH LABORATORY</span>
  </div>

  <div class="main-content">
    <h1 class="title">IRON DISTRICT FITNESS</h1>
    <div class="tagline-row">
      <div class="orange-bar"></div>
      <div class="tagline">BUILT BY DISCIPLINE.</div>
    </div>
  </div>

  <div class="bottom-meta">
    <span>UNCOMPROMISING BARBELL ARCHITECTURE</span>
    <span>14,000 SQ FT // 100% CAST IRON</span>
  </div>
</body>
</html>
